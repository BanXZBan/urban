<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban — Personal Introduction</title>
    
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ==========================================================================
           1. Core Reset & Global Styles
           ========================================================================== */
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent: #2563eb;
            --accent-light: #eff6ff;
            --border: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* ==========================================================================
           2. Layout & Card Container
           ========================================================================== */
        .profile-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 640px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #ffffff;
            padding: 3rem 2.5rem 2.5rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        header p {
            color: #94a3b8;
            font-size: 1.05rem;
            font-weight: 500;
        }

        main {
            padding: 2.5rem;
        }

        /* ==========================================================================
           3. Key Personal Metrics Grid
           ========================================================================== */
        .bio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .bio-item {
            background-color: var(--bg-color);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .bio-label {
            font-size: 0.825rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .bio-value {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-main);
        }

        /* ==========================================================================
           4. Hobbies & Passions Section
           ========================================================================== */
        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .interests-list {
            list-style: none;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .interest-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 1rem 1.25rem;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .interest-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
            background-color: var(--accent-light);
        }

        .interest-icon {
            font-size: 1.25rem;
        }

        .interest-text {
            font-weight: 500;
            color: var(--text-main);
        }

        /* ==========================================================================
           5. Footer & Interactive Callout
           ========================================================================== */
        footer {
            background-color: var(--bg-color);
            border-top: 1px solid var(--border);
            padding: 1.5rem 2.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .highlight-badge {
            display: inline-block;
            background-color: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        /* Mobile Responsiveness */
        @media (max-width: 480px) {
            header {
                padding: 2rem 1.5rem;
            }
            main {
                padding: 1.5rem;
            }
            .bio-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Main Container Card -->
    <div class="profile-card">
        
        <!-- Header: Primary Identity -->
        <header>
            <h1>Urban</h1>
            <p>Creator, Gamer & Web Developer</p>
        </header>

        <!-- Main Body: Structured Content -->
        <main>
            <!-- Personal Specs -->
            <section aria-labelledby="bio-heading">
                <h2 id="bio-heading" class="sr-only" style="display:none;">Personal Information</h2>
                <div class="bio-grid">
                    <article class="bio-item">
                        <span class="bio-label">Origin</span>
                        <span class="bio-value">🇮🇩 Indonesia</span>
                    </article>
                    <article class="bio-item">
                        <span class="bio-label">Height</span>
                        <span class="bio-value">5' 3" (160 cm)</span>
                    </article>
                </div>
            </section>

            <!-- Interests & Hobbies -->
            <section aria-labelledby="interests-heading">
                <h2 id="interests-heading" class="section-title">Passions & Interests</h2>
                <ul class="interests-list">
                    <li class="interest-card">
                        <span class="interest-icon" aria-hidden="true">✍️</span>
                        <span class="interest-text">Writing & Storytelling</span>
                    </li>
                    <li class="interest-card">
                        <span class="interest-icon" aria-hidden="true">🎮</span>
                        <span class="interest-text">Playing Games</span>
                    </li>
                    <li class="interest-card">
                        <span class="interest-icon" aria-hidden="true">📱</span>
                        <span class="interest-text">Exploring Tech & Gadgets</span>
                    </li>
                    <li class="interest-card">
                        <span class="interest-icon" aria-hidden="true">💻</span>
                        <span class="interest-text">Building Web Projects</span>
                    </li>
                </ul>
            </section>
        </main>

        <!-- Footer -->
        <footer>
            <p>Always working on something new.</p>
            <span class="highlight-badge">Currently Crafting Websites</span>
        </footer>

    </div>

</body>
</html>
